# local.yaml : C_PhishLens (Render)
# Purpose: config override copied into configs/ inside the Render image.
# Author: Colile Sibanda
#
# The config loader deep-merges this over default.yaml, so only the bind
# address changes: every interface, on Render's default web port.

serving:
  host: 0.0.0.0
  port: 10000
  trusted_proxy_hops: 3   # Render's proxy chain adds three X-Forwarded-For entries; the client is third from the right
